# ANDROID-SDK36-01: pin the Robolectric sandbox SDK.
#
# Robolectric defaults its sandbox to the app's targetSdk. Bumping targetSdk to 36
# therefore made every test class that does NOT pin its own @Config(sdk = [...])
# try to boot an SDK 36 sandbox, which fails on this toolchain:
#
#   java.lang.UnsupportedOperationException: Failed to create a Robolectric sandbox:
#   Android SDK 36 requires Java 21 (have Java 17)
#
# (Hit by ProfileBootstrapViewModelTest, EditPhoneViewModelTest,
#  PlaybackFeatureFlagsTest and DownloadRepositoryTest — the four Robolectric
#  classes with no explicit @Config sdk. The other ~56 pin 31 or 33 and were
#  unaffected.)
#
# 35 is exactly what those classes ran on before the bump, so this preserves
# existing behavior rather than changing it. The Robolectric sandbox SDK is the
# Android version the tests are emulated against; it is independent of the
# targetSdk the APK ships with, and pinning it does not reduce coverage.
#
# ponytail: the real fix is a JDK 21 toolchain, which lets Robolectric run a real
# SDK 36 sandbox and matches what the app now targets. That is a project-wide
# change — java.toolchain, kotlin jvmTarget and compileOptions in
# app/build.gradle.kts all pin 17 — so it is deliberately not bundled with the
# targetSdk bump. Raise this file to 36 in the same commit that moves the
# toolchain, and delete it once 36 is the default that works.
sdk=35
