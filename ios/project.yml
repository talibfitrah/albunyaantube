name: FitrahTube
options:
  bundleIdPrefix: com.albunyaan
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    DEVELOPMENT_TEAM: $(FITRAH_TEAM_ID)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  FitrahAPI:
    path: Packages/FitrahAPI
  InnerTubeKit:
    path: Packages/InnerTubeKit

targets:
  FitrahTube:
    type: application
    platform: iOS
    sources:
      - path: FitrahTube
        excludes:
          - "Info.plist"
    dependencies:
      - package: FitrahAPI
        product: FitrahAPI
      - package: InnerTubeKit
        product: InnerTubeKit
      # Phase 3 Task 8: the Google Cast iOS Sender SDK, vendored by `scripts/fetch-cast-sdk.sh`
      # (ios/Vendor/ is gitignored; test.sh's pre-stage heals a fresh checkout). The zip ships
      # exactly ONE xcframework -- no GoogleCastCore/protobuf members -- so this is the whole
      # dependency. Dynamic framework => Embed & Sign; `-ObjC -lc++` are static-build flags and
      # are deliberately NOT set.
      - framework: Vendor/GoogleCast.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albunyaan.tube
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FitrahTube/Info.plist
      properties:
        CFBundleDisplayName: FitrahTube
        CFBundleName: FitrahTube
        # gate A-I3: without these two, XcodeGen's own defaults win (CFBundleShortVersionString
        # "1.0") and About/App Store Connect report a literal that no version bump ever changes.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, nl]
        UILaunchScreen: {}
        # CF-B1-1: without this the audio session is torn down at suspension and background audio
        # is impossible regardless of what `BackgroundPlaybackController` asks for.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Phase 3 Task 8 (spec §10 Chromecast): Cast discovery is mDNS/Bonjour on the local
        # network. `_CC1AD845._googlecast._tcp` is the default media receiver's own service type
        # (`CastOptionsProvider.kt:36-42`). Without both entries discovery finds nothing and the
        # usage string is what iOS shows on the first cast-button tap (discovery -- and so the
        # prompt -- starts there, not at launch: `startDiscoveryAfterFirstTapOnCastButton` stays
        # at the SDK default).
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSLocalNetworkUsageDescription: FitrahTube finds Chromecast and other TV devices on your local network so you can play videos on your TV.
        CFBundleURLTypes:
          - CFBundleURLName: com.albunyaan.tube
            CFBundleURLSchemes: [albunyaantube]
        API_BASE_URL: $(API_BASE_URL)

  FitrahTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitrahTubeTests
      - path: Packages/FitrahAPI/Tests/FitrahAPITests/RecordingTransport.swift
      - path: Packages/FitrahAPI/Tests/FitrahAPITests/TestLimits.swift
    dependencies:
      - target: FitrahTube
      - package: FitrahAPI
        product: FitrahAPI
      - package: InnerTubeKit
        product: InnerTubeKit
      # `@testable import FitrahTube` exposes `CastController`'s internals, whose interface names
      # GoogleCast types -- so the test module needs the module on its search path too. NOT
      # embedded: the app host already carries the one copy this bundle loads into.
      - framework: Vendor/GoogleCast.xcframework
        embed: false
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # task-14 capture/assertion rig. Deliberately NOT in FitrahTube.xctestplan (and so never run by
  # ios/scripts/test.sh's 300s gate) -- it drives ~90 app launches. Run it via
  # ios/scripts/screenshots.sh, which selects FitrahTubeUITests.xctestplan.
  FitrahTubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitrahTubeUITests
    dependencies:
      - target: FitrahTube
    settings:
      base:
        # No SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor here (unlike the app/unit-test targets):
        # XCTestCase's designated initializers are nonisolated, so a MainActor-by-default subclass
        # fails to compile ("different actor isolation from nonisolated overridden declaration").
        TEST_TARGET_NAME: FitrahTube

schemes:
  FitrahTube:
    build:
      targets:
        FitrahTube: all
        FitrahTubeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitrahTubeTests
        - FitrahTubeUITests
      testPlans:
        - path: FitrahTube.xctestplan
          defaultPlan: true
        - path: FitrahTubeUITests.xctestplan
