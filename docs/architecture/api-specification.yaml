    # Content Library DTOs
    ContentLibraryResponse:
      type: object
      description: |
        Paginated response for content library. The `truncated` field indicates whether
        results may be incomplete due to bounded query limits (browse: max 2000 per
        content type; search: two queries of 200 per type, so max 400 scanned per type). UI should display a warning to users
        when `truncated` is true. GET /api/admin/content/totals carries the real
        registry size, counted independently of those bounds.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        totalItems:
          type: integer
          description: Total count of items matching filters within the bounded query window
        currentPage:
          type: integer
          description: Current page number (0-indexed)
        pageSize:
          type: integer
          description: Number of items per page
        totalPages:
          type: integer
          description: Total number of pages within the bounded query window
        truncated:
          type: boolean
          description: |
            Indicates whether results may be incomplete due to bounded query limits.
            When true, the server capped results to prevent Firestore quota exhaustion,
            and there may be more items matching the filters than shown. UI should
            display a message like "Showing most recent results. Use filters or search
            to find specific items." when this is true.

    RegistryTotals:
      type: object
      description: |
        Registry-wide counts per content type, from server-side aggregation. Served by
        GET /api/admin/content/totals, deliberately separate from the listing response so
        a slow count never delays or fails the content itself. Deliberately
        NOT filtered by status/category/search, so they stay stable while the user filters
        and may legitimately exceed the number of rows shown. `videos` counts only
        individually-curated video documents — approving a channel or playlist does not
        create video documents, so videos reachable through a channel or playlist are not
        counted here.
      properties:
        channels:
          type: integer
          format: int64
        playlists:
          type: integer
          format: int64
        videos:
          type: integer
          format: int64

    ContentItem:
      type: object
      description: Unified content item (channel/playlist/video) for content library
      properties:
        type:
          type: string
          enum: [channel, playlist, video]
        id:
          type: string
        youtubeId:
          type: string
          description: YouTube ID for video preview/player functionality
        title:
          type: string
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [APPROVED, PENDING, REJECTED, UNAVAILABLE]
        categoryIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        count:
          type: integer
          format: int64
          nullable: true
          description: Subscriber/video/view count depending on content type
        displayOrder:
          type: integer
          nullable: true
          description: Integer sort order. Lower values appear first. Null until explicitly set.
        visibility:
          type: string
          enum: [PUBLIC, PERSONAL]
          description: |
            Whether an APPROVED item is in the public catalogue or granted only to specific
            people. Legacy documents with no stored visibility are reported as PUBLIC.
        grantedTo:
          type: array
          description: |
            Display names (else emails, else uids) of the people a PERSONAL approval covers.
            Always empty for a PUBLIC item, even if stale grants remain on the document.
            Resolved for the returned page only.
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
          nullable: true
          description: Search keywords/tags for improved search accuracy. Auto-populated from YouTube tags during import if not provided.

    BulkActionRequest:
      type: object
      description: Request for bulk operations (approve/reject/delete)
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkActionItem'
          minItems: 1

    BulkActionItem:
      type: object
      description: Single item in a bulk action request
      required: [type, id]
      properties:
        type:
          type: string
          enum: [channel, playlist, video]
        id:
          type: string

    BulkCategoryAssignmentRequest:
      type: object
      description: Request for bulk category assignment
      required: [items, categoryIds]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkActionItem'
          minItems: 1
        categoryIds:
          type: array
          items:
            type: string
          description: Category IDs to assign to all items

    BulkActionResponse:
      type: object
      description: Response for bulk operations
      properties:
        successCount:
          type: integer
          description: Number of successfully processed items
        errors:
          type: array
          items:
            type: string
          description: List of error messages for failed items

    # Exclusion DTOs
    WorkspaceExclusion:
      type: object
      description: A single exclusion in the workspace
      required: [id, parentType, parentId, excludeType, excludeId]
      properties:
        id:
          type: string
          description: Composite ID in format "parentType:parentId:storageType:excludeId"
          example: "CHANNEL:abc123:VIDEO:xyz789"
        parentType:
          type: string
          enum: [CHANNEL, PLAYLIST]
          description: Type of parent entity
        parentId:
          type: string
          description: Internal ID of the parent channel or playlist
        parentYoutubeId:
          type: string
          nullable: true
          description: YouTube ID of the parent channel or playlist
        parentName:
          type: string
          nullable: true
          description: Name of the parent channel or playlist
        excludeType:
          type: string
          enum: [VIDEO, PLAYLIST]
          description: Type of excluded content
        excludeId:
          type: string
          description: YouTube ID of the excluded content
        reason:
          type: string
          nullable: true
          enum: [LIVESTREAM, SHORT, POST, null]
          description: Content sub-type reason (LIVESTREAM, SHORT, POST, or null for plain video/playlist)
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Best-available timestamp for the exclusion. Currently derived from the parent entity's updatedAt field (not per-exclusion creation time).
        createdBy:
          nullable: true
          description: Reserved for future use. Currently always null (per-exclusion creator tracking is not implemented).
          oneOf:
            - $ref: '#/components/schemas/AdminUserSummary'
            - type: 'null'

    AdminUserSummary:
      type: object
      description: Simplified admin user info for display
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          nullable: true
          description: User email
        displayName:
          type: string
          nullable: true
          description: User display name

    CreateExclusionRequest:
      type: object
      description: Request body for creating an exclusion
      required: [parentType, parentId, excludeType, excludeId]
      properties:
        parentType:
          type: string
          enum: [CHANNEL, PLAYLIST]
          description: Type of parent entity
        parentId:
          type: string
          description: Internal ID of the parent channel or playlist
        excludeType:
          type: string
          enum: [VIDEO, PLAYLIST]
          description: Type of content to exclude
        excludeId:
          type: string
          description: YouTube ID of the content to exclude
        reason:
          type: string
          nullable: true
          enum: [LIVESTREAM, SHORT, POST]
          description: Content sub-type reason. Routes VIDEO exclusions to the correct storage list (e.g., LIVESTREAM to liveStreams)

    ExclusionPage:
      type: object
      description: Cursor-paginated list of exclusions
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceExclusion'
        pageInfo:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
              description: Cursor for fetching the next page (null if no more pages)
            hasNext:
              type: boolean
              description: Whether more pages are available
            totalCount:
              type: integer
              nullable: true
              description: Total count of matching items (may not always be available)
            truncated:
              type: boolean
              nullable: true
              description: Whether results were truncated due to safety limits (e.g., max 500 channels). When true, totalCount and results may be incomplete.

    # Download DTOs
    DownloadTokenRequest:
