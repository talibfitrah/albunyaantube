openapi: 3.0.3
info:
  title: FitrahTube API
  version: 1.0.0
  description: |
    REST API for FitrahTube backend. Production implementation with 113+ endpoints across 14 controllers.

    **Key Features:**
    - Public content API for Android app (no auth required)
    - Admin/moderator content management with approval workflows
    - YouTube integration for content discovery
    - Bulk import/export functionality
    - Video validation and health monitoring
    - Comprehensive audit logging

    **Authentication:**
    - Firebase Authentication with JWT tokens
    - Role-based access: ADMIN, MODERATOR
    - Public endpoints require no authentication

    **Pagination:**
    - Cursor-based pagination for infinite scroll
    - Page-based pagination for admin interfaces

    **Caching:**
    - Categories: 1 hour TTL
    - Channels: 15 minutes TTL
    - YouTube searches: Varies by type

servers:
  - url: http://localhost:8080/api
    description: Local Development
  - url: http://192.168.1.167:8080/api
    description: Local Network (Android Testing)
  - url: https://api.albunyaan.com/api
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Public Content
    description: Public API for mobile app (no auth required)
  - name: Categories
    description: Category management (hierarchical tree)
  - name: Channels
    description: Channel management with approval workflow
  - name: Playlists
    description: Playlist management (via Registry)
  - name: Videos
    description: Video management (via Registry)
  - name: Registry
    description: Internal content registry API (admin workflow)
  - name: YouTube
    description: YouTube Data API integration
  - name: Users
    description: Admin and moderator user management
  - name: Audit
    description: Audit log viewing
  - name: Dashboard
    description: Analytics and metrics
  - name: Approvals
    description: Content approval workflow
  - name: Player
    description: Player functionality (recommendations)
  - name: Downloads
    description: Video download management
  - name: Import/Export
    description: Bulk data import and export
  - name: Validation
    description: Video validation and health checks
  - name: Content Library
    description: Unified content library management
  - name: Exclusions
    description: Workspace-level exclusion management

paths:
  # ============================================================================
  # PUBLIC CONTENT API (No Authentication Required)
  # ============================================================================

  /v1/content:
    get:
      summary: Get paginated content for mobile app
      description: |
        Fetch content filtered by type (HOME, CHANNELS, PLAYLISTS, VIDEOS).
        Returns cursor-paginated results for infinite scroll.
      operationId: getPublicContent
      tags: [Public Content]
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [HOME, CHANNELS, PLAYLISTS, VIDEOS]
            default: HOME
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: category
          in: query
          description: Filter by category slug
          schema:
            type: string
        - name: length
          in: query
          schema:
            type: string
            enum: [SHORT, MEDIUM, LONG]
        - name: date
          in: query
          schema:
            type: string
            enum: [LAST_24_HOURS, LAST_7_DAYS, LAST_30_DAYS]
        - name: sort
          in: query
          schema:
            type: string
            enum: [DEFAULT, MOST_POPULAR, NEWEST]
        - name: q
          in: query
          description: Text search filter applied server-side (max 128 chars, case-insensitive)
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Content page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPageDto'
                  - type: object
                    description: Cursor-paginated mixed content response
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContentItemDto'

  /v1/categories:
    get:
      summary: List all active categories
      operationId: listPublicCategories
      tags: [Public Content]
      security: []
      responses:
        '200':
          description: Category list (simplified DTOs without admin metadata)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDto'

  /v1/home:
    get:
      summary: Get paginated home feed with category sections
      description: |
        Returns categories in admin-defined displayOrder, each containing up to
        contentLimit items in admin-defined sort order. Supports cursor-based
        pagination for infinite scroll of category sections.
      operationId: getHomeFeed
      tags: [Public Content]
      security: []
      parameters:
        - name: cursor
          in: query
          description: Base64-encoded cursor from previous page
          schema:
            type: string
        - name: categoryLimit
          in: query
          description: Max categories per page
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        - name: contentLimit
          in: query
          description: Max items per category
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Paginated home feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPageDto'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/HomeCategoryDto'

  /v1/channels/{channelId}:
    get:
      summary: Get channel details by YouTube ID
      operationId: getPublicChannel
      tags: [Public Content]
      security: []
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
          description: YouTube channel ID
      responses:
        '200':
          description: Channel entity (without nested playlists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/playlists/{playlistId}:
    get:
      summary: Get playlist details by YouTube ID
      operationId: getPublicPlaylist
      tags: [Public Content]
      security: []
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
          description: YouTube playlist ID
      responses:
        '200':
          description: Playlist entity (without nested videos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/videos/{videoId}:
    get:
      summary: Get video details by YouTube ID
      operationId: getPublicVideo
      tags: [Public Content]
      security: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
          description: YouTube video ID
      responses:
        '200':
          description: Video entity with metadata and approval status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '404':
          description: Video not found or not approved/available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/search:
    get:
      summary: Search across all content types
      operationId: searchPublicContent
      tags: [Public Content]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [CHANNELS, PLAYLISTS, VIDEOS]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentItemDto'
                description: Array of matching content items (not paginated)

  /v1/reports:
    post:
      summary: Submit a content report
      operationId: submitContentReport
      tags: [Public Content]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reasons]
              properties:
                targetType:
                  type: string
                  enum: [VIDEO, PLAYLIST, CHANNEL]
                targetId:
                  type: string
                  maxLength: 128
                reasons:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [MUSIC, NUDITY, BAD_LANGUAGE, FLIRTING, ROMANCE, AWRAH, SHIRK, BIDAH, VIOLENCE, MISINFORMATION, OTHER]
                otherDescription:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        '201':
          description: Report submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReport'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (max 5 reports per device per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/reports:
    get:
      summary: List submitted reports (admin/moderator)
      operationId: getReports
      tags: [Reports]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, RESOLVED, REJECTED]
        - name: targetType
          in: query
          schema:
            type: string
            enum: [VIDEO, PLAYLIST, CHANNEL]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentReport'

  /admin/reports/{id}:
    patch:
      summary: Resolve or reject a report (admin/moderator)
      operationId: resolveReport
      tags: [Reports]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [RESOLVED, REJECTED]
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReport'

  /admin/reports/stats:
    get:
      summary: Report statistics (admin/moderator)
      operationId: getReportStats
      tags: [Reports]
      responses:
        '200':
          description: Report counts by status
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  resolved:
                    type: integer
                  rejected:
                    type: integer
                  newLast3h:
                    type: integer

  # ============================================================================
  # SORT ORDER (Admin)
  # ============================================================================

  /admin/sort/categories:
    get:
      summary: Get categories in sort order with content counts
      operationId: getCategorySortOrder
      tags: [Sort Order]
      responses:
        '200':
          description: Categories sorted by displayOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySortDto'

  /admin/sort/categories/reorder:
    put:
      summary: Reorder a category (insert-and-shift)
      operationId: reorderCategory
      tags: [Sort Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, newPosition]
              properties:
                categoryId:
                  type: string
                newPosition:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated category sort order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySortDto'

  /admin/sort/categories/{categoryId}/content:
    get:
      summary: Get content items in sort order within a category
      operationId: getCategoryContentOrder
      tags: [Sort Order]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content items sorted by position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSortDto'

  /admin/sort/categories/{categoryId}/content/reorder:
    put:
      summary: Reorder content within a category (insert-and-shift)
      operationId: reorderContentInCategory
      tags: [Sort Order]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentId, contentType, newPosition]
              properties:
                contentId:
                  type: string
                contentType:
                  type: string
                  enum: [channel, playlist, video]
                newPosition:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated content sort order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSortDto'

  # ============================================================================
  # CATEGORIES (Admin/Moderator)
  # ============================================================================

  /admin/categories:
    get:
      summary: List all categories (hierarchical)
      operationId: listCategories
      tags: [Categories]
      responses:
        '200':
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create new category
      operationId: createCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /admin/categories/top-level:
    get:
      summary: Get top-level categories only
      operationId: listTopLevelCategories
      tags: [Categories]
      responses:
        '200':
          description: Top-level categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /admin/categories/{parentId}/subcategories:
    get:
      summary: Get subcategories of a parent
      operationId: listSubcategories
      tags: [Categories]
      parameters:
        - name: parentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /admin/categories/{id}:
    get:
      summary: Get category by ID
      operationId: getCategory
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    put:
      summary: Update category
      operationId: updateCategory
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      summary: Delete category (fails if has subcategories)
      operationId: deleteCategory
      tags: [Categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted

  # ============================================================================
  # CHANNELS (Admin/Moderator)
  # ============================================================================

  /admin/channels:
    get:
      summary: List channels with optional status filter
      operationId: listChannels
      tags: [Channels]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: approved
      responses:
        '200':
          description: Channel list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
    post:
      summary: Submit channel for approval
      description: Admins auto-approve, moderators submit as pending
      operationId: createChannel
      tags: [Channels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'

  /admin/channels/category/{categoryId}:
    get:
      summary: Get channels by category
      operationId: getChannelsByCategory
      tags: [Channels]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channels in category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'

  /admin/channels/{id}:
    get:
      summary: Get channel by ID
      operationId: getChannel
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
    delete:
      summary: Delete channel
      operationId: deleteChannel
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Channel deleted

  /admin/channels/{id}/approve:
    put:
      summary: Approve channel
      operationId: approveChannel
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'

  /admin/channels/{id}/reject:
    put:
      summary: Reject channel
      operationId: rejectChannel
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'

  /admin/channels/{id}/exclusions:
    get:
      summary: Get channel exclusions
      operationId: getChannelExclusions
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exclusions
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Update channel exclusions (bulk)
      operationId: updateChannelExclusions
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Exclusions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'

  /admin/channels/{id}/exclusions/{type}/{youtubeId}:
    post:
      summary: Add single exclusion to channel
      operationId: addChannelExclusion
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [video, playlist, livestream, short, post]
        - name: youtubeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exclusion added
    delete:
      summary: Remove single exclusion from channel
      operationId: removeChannelExclusion
      tags: [Channels]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [video, playlist, livestream, short, post]
        - name: youtubeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exclusion removed

  # ============================================================================
  # REGISTRY (Admin/Moderator - Internal Workflow API)
  # ============================================================================

  /admin/registry/channels:
    get:
      summary: List all channels in registry
      operationId: registryListChannels
      tags: [Registry]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
    post:
      summary: Add channel to registry
      operationId: registryAddChannel
      tags: [Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
      responses:
        '201':
          description: Channel added
        '409':
          description: Channel already exists

  /admin/registry/channels/status/{status}:
    get:
      summary: Get channels by status
      operationId: registryGetChannelsByStatus
      tags: [Registry]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'

  /admin/registry/channels/{id}:
    get:
      summary: Get channel by ID
      operationId: registryGetChannel
      tags: [Registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
    put:
      summary: Update channel in registry
      operationId: registryUpdateChannel
      tags: [Registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: Channel updated
    delete:
      summary: Delete channel from registry
      operationId: registryDeleteChannel
      tags: [Registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Channel deleted

  /admin/registry/channels/{id}/toggle:
    patch:
      summary: Toggle channel APPROVED/PENDING status
      operationId: registryToggleChannel
      tags: [Registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status toggled

  /admin/registry/playlists:
    get:
      summary: List all playlists in registry
      operationId: registryListPlaylists
      tags: [Registry]
      responses:
        '200':
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'
    post:
      summary: Add playlist to registry
      operationId: registryAddPlaylist
      tags: [Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playlist'
      responses:
        '201':
          description: Playlist added
        '409':
          description: Playlist already exists

  /admin/registry/playlists/status/{status}:
    get:
      summary: Get playlists by status
      operationId: registryGetPlaylistsByStatus
      tags: [Registry]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'

  /admin/registry/playlists/{id}:
    get:
      summary: Get playlist by ID
      operationId: registryGetPlaylist
      tags: [Registry]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Playlist
          content:
            application/json:
