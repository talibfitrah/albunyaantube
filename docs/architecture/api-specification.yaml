  /admin/approvals/pending:
    get:
      summary: List pending approvals
      description: |
        Returns pending approvals with cursor-based pagination.

        **Cursor Behavior:**
        - Single-type queries (type=CHANNEL or type=PLAYLIST): Uses standard cursor encoding with document ID and createdAt timestamp.
        - Mixed-type queries (type omitted): Uses composite cursor that encodes separate positions for channels and playlists collections to ensure monotonic pagination across collections.

        **Ordering:**
        - Results are ordered by createdAt DESC, with document ID as secondary sort for deterministic ordering when timestamps collide.

        **Cursor Format:**
        - Cursors are opaque, URL-safe Base64 tokens. Clients should not parse or construct cursors—always use the `nextCursor` value from previous response.
      operationId: listPendingApprovals
      tags: [Approvals]
      parameters:
        - name: type
          in: query
          description: Filter by content type. Omit to get both channels and playlists merged by timestamp.
          schema:
            type: string
            enum: [CHANNEL, PLAYLIST]
        - name: category
          in: query
          description: Filter by category ID
          schema:
            type: string
        - name: limit
          in: query
          description: Number of items per page (default 20)
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor token from previous response's pageInfo.nextCursor
          schema:
            type: string
        - name: submittedBy
          in: query
          description: |
            Narrow the queue to one submitter's pending items — the drill-down from the by-user
            tab. The per-submitter query has no category dimension, so combining this with
            `category` is rejected with 400 rather than silently returning unfiltered results.
          schema:
            type: string
      responses:
        '400':
          description: Invalid parameters, including `submittedBy` combined with `category`
        '200':
          description: Pending approvals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPageDto'
                  - type: object
                    description: Cursor-paginated pending approvals
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingApprovalDto'

  /admin/approvals/pending-by-user:
    get:
      summary: Pending submissions rolled up by submitter
      description: |
        Who has imported content still waiting for review, and how much each of them has.

        Only `USER_IMPORT` submissions are rolled up here; moderator and admin submissions (and
        legacy rows with no recorded source) stay in the main queue at `/admin/approvals/pending`.

        The scan is bounded per collection, so a queue deeper than the bound under-reports rather
        than issuing an unbounded read. Ordered by pending count descending.
      operationId: listPendingSubmitters
      tags: [Approvals]
      responses:
        '200':
          description: Submitters with pending imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingSubmitterDto'
        '503':
          description: Roll-up unavailable

  /admin/approvals/{id}/approve:
    post:
      summary: Approve pending item
      operationId: approvePendingItem
      tags: [Approvals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewNotes:
                  type: string
                categoryOverride:
                  type: string
                  description: |
                    Optional. Applied only when the item has no categories of its own. Omit to
                    approve the item uncategorized — it stays reachable through the type listings
                    and search, but appears under no category until one is assigned. Must name an
                    existing category when supplied.
      responses:
        '200':
          description: Item approved
        '400':
          description: categoryOverride does not name an existing category

