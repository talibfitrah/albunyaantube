  # ============================================================================
  # BULK SUBMISSION (Admin/Moderator)
  # ============================================================================

  /admin/registry/bulk/preview:
    post:
      summary: Dry-run bulk URL submission — validate and resolve up to 25 URLs
      description: >
        Accepts a list of YouTube URLs (videos, channels, playlists) and a set of
        default category IDs. Resolves each URL via NewPipe, checks for duplicates,
        and returns a per-row preview with metadata, detected type, and any errors.
        Does NOT write to Firestore. Requires ADMIN or MODERATOR role.
      operationId: registryBulkPreview
      tags: [Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPreviewRequest'
      responses:
        '200':
          description: Preview results (one entry per submitted URL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPreviewResponse'
        '400':
          description: Validation error (e.g. empty URL list, too many URLs)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/registry/bulk/submit:
    post:
      summary: Commit a previewed batch of URLs into the registry
      description: >
        Writes each row from a prior preview into Firestore. Only rows with
        status OK should be submitted; DUPLICATE/ERROR rows are silently
        skipped with status FAILED. The optional `status` field defaults to
        PENDING; only ADMIN role may set it to APPROVED.
        Requires ADMIN or MODERATOR role.
      operationId: registryBulkSubmit
      tags: [Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkSubmitRequest'
      responses:
        '200':
          description: Submit results with per-row outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSubmitResponse'
        '400':
          description: Validation error (e.g. empty row list, too many rows)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

