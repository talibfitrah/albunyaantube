        whether it already exists in the registry and its current approval status.
        Requires ADMIN or MODERATOR role.
      operationId: youtubeSearch
      tags: [YouTube]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
          description: Search query or YouTube URL
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, CHANNEL, PLAYLIST, VIDEO]
            default: ALL
          description: Content type filter (ALL returns mixed results)
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
          description: Opaque page token from a previous response (omit for first page)
      responses:
        '200':
          description: Search results annotated with registry state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeSearchResponse'
        '429':
          description: YouTube is rate-limiting this server (ReCaptcha required)
          headers:
