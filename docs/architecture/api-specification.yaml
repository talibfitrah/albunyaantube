      properties:
        reviewedBy:
          type: string
          nullable: true
          description: Firebase UID of the reviewer
        reviewerDisplayName:
          type: string
          nullable: true
          description: Display name of the reviewer (cached)
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the review happened
        reviewNotes:
          type: string
          nullable: true
          description: Review notes from the moderator
        rejectionReason:
          type: string
          nullable: true
          description: Rejection reason (for rejected items)

    PendingApprovalDto:
      type: object
      description: Pending approval item
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CHANNEL, PLAYLIST, VIDEO]
        entityId:
          type: string
          description: ID of the actual channel/playlist/video
        title:
          type: string
        category:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
          description: Cover image / avatar URL surfaced by the approval queue UI
        youtubeId:
          type: string
          nullable: true
          description: |
            YouTube canonical ID for the channel / playlist / video. Backend
            writes this at the top level so the admin UI can link out without
            digging through `metadata`. Some callers may still see this as
            absent from older response caches during a rolling deploy — the
            frontend falls back to `metadata.youtubeId` for that window.
        submittedAt:
          type: string
          format: date-time
        submittedBy:
          type: string
        status:
          type: string
          nullable: true
          enum: [PENDING, APPROVED, REJECTED]
          description: Current approval status (included in my-submissions responses)
        rejectionReason:
          type: string
          nullable: true
          description: Rejection reason if status is REJECTED
        reviewNotes:
          type: string
          nullable: true
          description: Review notes from the admin reviewer
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata (subscribers, video count, etc.)

    ApprovalRequestDto:
      type: object
      description: Request to approve a pending item
      properties:
        reviewNotes:
          type: string
          description: Review notes (required for approval)
        categoryOverride:
          type: string
          nullable: true
          description: Optional category override
        scope:
          type: string
          nullable: true
          enum:
            - PUBLIC
            - PERSONAL
          description: "Finding 3 — approval scope. PUBLIC (default/null) approves into the public library for everyone; PERSONAL approves only for the importing user(s) and skips the category requirement."

    ApprovalResponseDto:
      type: object
      description: Response after approval action
      properties:
        success:
          type: boolean
        message:
          type: string
        entityId:
          type: string
          nullable: true

    RejectionRequestDto:
      type: object
      description: Request to reject a pending item
      properties:
        reason:
          type: string
          description: |
            Optional feedback for the submitter. Omit to reject without a reason — a blank reason
            is stored as absent rather than coerced to a placeholder the reviewer never wrote.

    PendingSubmitterDto:
      type: object
      description: One person with imported content awaiting review
      properties:
        uid:
          type: string
          description: Firebase uid — use as the `submittedBy` filter to drill into their queue
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        label:
          type: string
          description: Display name, else email, else the raw uid
        pendingCount:
          type: integer
          format: int64
          description: How many of their submissions are still PENDING

    # Public API Response Wrappers
    ChannelDetailResponse:
      type: object
      description: Channel details with associated playlists
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        playlists:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'

    PlaylistDetailResponse:
      type: object
      description: Playlist details with associated videos
      properties:
        playlist:
          $ref: '#/components/schemas/Playlist'
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'

    ContentItemDto:
      type: object
      description: Unified DTO for content items (channels, playlists, videos) in public API. Fields are nullable to accommodate different content types.
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CHANNEL, PLAYLIST, VIDEO]
          description: Content type discriminator
        # Common fields
        title:
          type: string
          nullable: true
          description: Title for playlists and videos
        name:
          type: string
          nullable: true
          description: Name for channels
        category:
          type: string
          nullable: true
          description: Category name
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        # Video-specific fields
        durationSeconds:
          type: integer
          nullable: true
          description: Video duration in seconds (videos only)
        uploadedDaysAgo:
          type: integer
          nullable: true
          description: Days since upload (videos only)
        viewCount:
          type: integer
          format: int64
          nullable: true
          description: View count (videos only)
        channelTitle:
          type: string
          nullable: true
          description: Channel name for video/stream results
        # Channel-specific fields
        subscribers:
          type: integer
          format: int64
          nullable: true
          description: Subscriber count (channels only)
        videoCount:
          type: integer
          nullable: true
          description: Number of videos (channels only)
        # Playlist-specific fields
        itemCount:
          type: integer
          nullable: true
          description: Number of items (playlists only)

    ContentDto:
      type: object
      description: Polymorphic content item (channel/playlist/video) for public API
      oneOf:
        - $ref: '#/components/schemas/Channel'
        - $ref: '#/components/schemas/Playlist'
        - $ref: '#/components/schemas/Video'

    User:
      type: object
      properties:
        uid:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, moderator]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actorUid:
          type: string
        actorEmail:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object

    ErrorResponse:
      type: object
      description: Generic error response for 4xx and 5xx errors
      properties:
        error:
          type: string
          description: Error type or code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          nullable: true
          description: Additional error context (optional)


    # ===========================================================================
    # BULK SUBMISSION — BULK-01
    # ===========================================================================

    VideoType:
      type: string
      enum: [STANDARD, LIVE]
      description: >
        Distinguishes live YouTube videos (LIVE) from regular videos (STANDARD).
        Null on legacy Video documents is treated as STANDARD.

    BulkPreviewRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
            minLength: 1
          description: YouTube URLs to preview (videos, channels, playlists). Max 25.

    BulkPreviewResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PreviewRow'
          description: One entry per submitted URL, in submission order.

    PreviewRow:
      type: object
      required: [rowIndex, originalUrl, status]
      properties:
        rowIndex:
          type: integer
          description: Zero-based position in the submitted URL list.
        originalUrl:
          type: string
          description: The URL exactly as submitted.
        detectedType:
          type: string
          enum: [VIDEO, CHANNEL, PLAYLIST]
          nullable: true
          description: Content type inferred from the URL structure.
        videoType:
          $ref: '#/components/schemas/VideoType'
          nullable: true
          description: STANDARD or LIVE. Populated only when detectedType is VIDEO.
        metadata:
          $ref: '#/components/schemas/PreviewMetadata'
          nullable: true
          description: NewPipe metadata snapshot. Null when status is ERROR.
        status:
          $ref: '#/components/schemas/RowStatus'
        duplicateOf:
          type: string
          nullable: true
          description: Registry document ID of the existing entry (set when status is DUPLICATE or DUPLICATE_REJECTED).
        duplicateStatus:
          type: string
          nullable: true
          description: Approval status of the duplicate entry (e.g. APPROVED, PENDING, REJECTED).
        error:
          $ref: '#/components/schemas/PreviewError'
          nullable: true
          description: Error detail. Null unless status is ERROR.

    PreviewMetadata:
      type: object
      description: Sparse NewPipe metadata snapshot. Fields are populated based on detected content type.
      properties:
        youtubeId:
          type: string
          nullable: true
          description: YouTube video/channel/playlist ID.
        title:
          type: string
          nullable: true
          description: Title of the content.
        thumbnailUrl:
          type: string
          nullable: true
          description: Best available thumbnail URL.
        channelName:
          type: string
          nullable: true
          description: Channel name (populated for videos and playlists).
        channelId:
          type: string
          nullable: true
          description: YouTube channel ID (populated for videos and playlists).
        subscribers:
          type: integer
          format: int64
          nullable: true
          description: Subscriber count (populated for channels; -1 if unavailable).
        itemCount:
          type: integer
          format: int64
          nullable: true
          description: Video count (populated for channels and playlists).
        durationSeconds:
          type: integer
          format: int64
          nullable: true
          description: Duration in seconds (populated for videos).
        viewCount:
          type: integer
          format: int64
          nullable: true
          description: View count (populated for videos).

    RowStatus:
      type: string
      enum: [OK, DUPLICATE, DUPLICATE_REJECTED, ERROR]
      description: >
        OK — ready to submit; DUPLICATE — already in registry with non-rejected status;
        DUPLICATE_REJECTED — exists but was rejected (may re-submit); ERROR — URL could not be resolved.

    PreviewError:
      type: object
      required: [code, messageKey]
      properties:
        code:
          $ref: '#/components/schemas/PreviewErrorCode'
        messageKey:
          type: string
          description: i18n message key (e.g. contentSearch.bulk.errors.NOT_YOUTUBE_URL).

    PreviewErrorCode:
      type: string
      enum:
        - UNSUPPORTED_SHORTS
        - UNSUPPORTED_TYPE
        - UNSUPPORTED_HANDLE
        - NOT_YOUTUBE_URL
        - CONTENT_NOT_AVAILABLE
        - PRIVATE_CONTENT
        - AGE_RESTRICTED
        - GEO_RESTRICTED
        - CHANNEL_TERMINATED
        - NEWPIPE_PARSING_ERROR
        - NETWORK_ERROR
        - INTERNAL_ERROR
        - DUPLICATE
        - DUPLICATE_REJECTED
      description: |
        Machine-readable error code for a failed preview row, and (post-Plan-G
        2026-05-23) for failed submit rows where the gateway re-fetch returns
        an error. Submit also emits the literal strings `INVALID_CATEGORY`,
        `YOUTUBE_ID_MISMATCH`, `TYPE_MISMATCH`, `INVALID_URL`, `FETCH_ERROR`,
        and `WRITE_ERROR` via SubmitResult.errorCode (free-form string).

    BulkSubmitRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/SubmitRow'
          description: Rows to write. Should contain only rows with status OK from the prior preview.
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          nullable: true
          description: >
            Override approval status for all submitted items. Defaults to PENDING.
            Only ADMIN role may set APPROVED; MODERATOR requests with APPROVED are rejected with 403.

    SubmitRow:
      type: object
      required: [rowIndex, originalUrl, detectedType, metadata, categoryIds]
      properties:
        rowIndex:
          type: integer
          description: Zero-based row index matching the original preview response.
        originalUrl:
          type: string
          minLength: 1
          description: Original URL from the preview request.
        detectedType:
          type: string
          enum: [VIDEO, CHANNEL, PLAYLIST]
          description: Content type from the preview response. Must not be null.
        videoType:
          $ref: '#/components/schemas/VideoType'
          nullable: true
          description: STANDARD or LIVE. Required when detectedType is VIDEO, null otherwise.
        metadata:
          $ref: '#/components/schemas/PreviewMetadata'
          description: Metadata from the preview response (must not be null).
        categoryIds:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Category IDs to assign to this item (user-confirmed, may differ from defaultCategoryIds).

    BulkSubmitResponse:
      type: object
      required: [totalSubmitted, added, failed, results]
      properties:
        totalSubmitted:
          type: integer
          description: Total number of rows processed.
        added:
          type: integer
          description: Number of rows successfully written to Firestore.
        failed:
          type: integer
          description: Number of rows that failed to write.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SubmitResult'
          description: Per-row outcome in submission order.

    SubmitResult:
      type: object
      required: [rowIndex, originalUrl, status]
      properties:
        rowIndex:
          type: integer
          description: Zero-based row index matching the submit request.
        originalUrl:
          type: string
          description: Original URL from the submit request.
        registryId:
          type: string
          nullable: true
          description: Firestore document ID of the newly created registry entry. Null when status is FAILED.
        status:
          $ref: '#/components/schemas/SubmitStatus'
        errorCode:
          type: string
          nullable: true
          description: Error code string when status is FAILED (e.g. WRITE_ERROR). Null on success.

    SubmitStatus:
      type: string
      enum: [ADDED, FAILED]
      description: Outcome of a single row in a bulk submit.

  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
