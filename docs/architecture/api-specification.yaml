  # ============================================================================
  # CONTENT LIBRARY (Admin/Moderator)
  # ============================================================================

  /admin/content/approved-picker:
    get:
      summary: Approved content for the category picker
      description: |
        Every approved item, carrying only the fields the "add content to a category" picker
        renders. One request, no paging.

        Replaces a client-side loop over `/admin/content` that could not terminate on its own:
        that endpoint's `totalPages` describes its current fetch window, which grows by one page
        per content type each round, so the target outran the loop until it hit a client-side
        safety cap — while offset paging re-read every earlier row on each request.

        Five fields, not three: `getThumbnailUrl()` on the client reads `thumbnailUrl` first and
        otherwise builds a URL from `youtubeId`, so both carry the image.

        Bounded per content type. `truncated` reports the bound rather than applying it silently.
      operationId: listApprovedForPicker
      tags: [Content Library]
      responses:
        '200':
          description: Approved content for the picker
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [channel, playlist, video]
                        id:
                          type: string
                        title:
                          type: string
                        thumbnailUrl:
                          type: string
                          nullable: true
                        youtubeId:
                          type: string
                          nullable: true
                  truncated:
                    type: boolean
                    description: A content type filled its scan bound, so more approved content may exist

  /admin/content:
    get:
      summary: Get all content with filtering
      description: |
        Retrieves content items (channels, playlists, videos) with support for filtering,
        searching, and pagination.

        **Search Behavior:**
        Search matches against title, keywords/tags, and description fields using
        case-insensitive contains matching. This enables finding content by:
        - Partial title text (e.g., "islam" matches "Introduction to Islam")
        - Keyword tags (e.g., "quran" matches items tagged with "quran recitation")
        - Description text (e.g., "arabic" matches items with "arabic" in description)

        **Query Limits (Important):**
        To prevent Firestore quota exhaustion, this endpoint uses bounded queries.
        Browsing is bounded at 2000 items per content type; a search scans at most 200
        per type. When the `truncated` field in the response is `true`, there may be
        more matching items than shown — call GET /api/admin/content/totals for the
        real size.

        **Best Practices for Large Datasets:**
        - Use specific type filters (`types=channel`) instead of fetching all types
        - Apply category and status filters to narrow results
        - Use pagination (`page`, `size`) for browsing
        - For finding specific items, use the search parameter with distinctive terms
      operationId: listContent
      tags: [Content Library]
      parameters:
        - name: types
          in: query
          description: Comma-separated content types to include. Defaults to all types.
          schema:
            type: string
            example: channel,playlist,video
        - name: status
          in: query
          description: Filter by approval status
          schema:
            type: string
            enum: [all, approved, pending, rejected]
            default: all
        - name: category
          in: query
          description: Filter by category ID
          schema:
            type: string
        - name: search
          in: query
          description: |
            Search term to filter results. Matches against title, keywords, and description
            using case-insensitive contains matching. Note: a search issues two bounded
            queries per content type at 200 each, so it scans at most 400 documents per
            type, independently of the browse ceiling.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order for results
          schema:
            type: string
            enum: [newest, oldest, custom]
            default: newest
        - name: page
          in: query
          description: Page number (0-indexed)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size (max 100)
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Content library page with pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLibraryResponse'

  /admin/content/totals:
    get:
      summary: Registry-wide content counts per type
      description: |
        Per-type counts of everything in the registry, from server-side aggregation.
        Separate from the listing endpoint on purpose: the counts depend on no listing
        parameter, so keeping them off that request means a slow or failing count never
        delays or fails the content itself. Unaffected by filters, paging or the listing
        query bounds.
      operationId: getContentTotals
      tags: [Content Library]
      responses:
        '200':
          description: Registry-wide counts per content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryTotals'

  /admin/content/bulk/approve:
    post:
      summary: Bulk approve content items
      operationId: bulkApprove
      tags: [Content Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [channel, playlist, video]
                      id:
                        type: string
      responses:
        '200':
          description: Bulk action results

  /admin/content/bulk/reject:
    post:
      summary: Bulk reject content items
      operationId: bulkReject
      tags: [Content Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [channel, playlist, video]
                      id:
                        type: string
      responses:
        '200':
          description: Bulk action results

  /admin/content/bulk/delete:
    post:
      summary: Bulk delete content items
      operationId: bulkDelete
      tags: [Content Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [channel, playlist, video]
                      id:
                        type: string
      responses:
        '200':
          description: Bulk action results

  /admin/content/bulk/assign-categories:
    post:
      summary: Bulk assign categories to content items
      operationId: bulkAssignCategories
      tags: [Content Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, categoryIds]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [type, id]
                    properties:
                      type:
                        type: string
                        enum: [channel, playlist, video]
                      id:
                        type: string
                categoryIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk action results

  /admin/content/bulk/reorder:
    post:
      summary: Bulk reorder content items
      description: |
        Update display order for multiple content items. Lower displayOrder values appear first.

        **Sorting Behavior:**
        - displayOrder is scoped globally across all content types
        - Items with the same displayOrder are sorted by creation date (newest first)
        - displayOrder is null until explicitly set via this endpoint

        **Error Handling:**
        - Returns 400 if any content item ID does not exist
        - Returns 400 if displayOrder values are negative
      operationId: bulkReorderContent
      tags: [Content Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, id, displayOrder]
                    properties:
                      type:
                        type: string
                        enum: [channel, playlist, video]
                        description: Content type
                      id:
                        type: string
                        description: Document ID of the content item
                      displayOrder:
                        type: integer
                        minimum: 0
                        description: New display order position (lower values appear first)
      responses:
        '200':
          description: Reorder results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'
        '400':
          description: Invalid request - missing or invalid items
        '401':
          description: Not authenticated
        '403':
          description: Requires ADMIN role
        '503':
          description: Service temporarily unavailable - Firestore or backend service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'

  /admin/content/{type}/{id}/keywords:
    put:
      summary: Update keywords/tags for a content item
      description: |
        Update the keywords (tags) for a channel, playlist, or video.
        Keywords improve search accuracy by providing additional searchable terms.

        **Auto-enrichment:**
        Keywords can be auto-populated from YouTube tags during import if not provided.
        This endpoint allows manual override/editing of keywords.

        **Validation:**
        - Maximum 50 keywords per item
        - Each keyword max 100 characters
        - Empty/whitespace keywords are filtered out
      operationId: updateKeywords
      tags: [Content Library]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [channel, playlist, video]
          description: Content type
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Document ID of the content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                  maxItems: 50
                  nullable: true
                  description: List of keywords/tags. Set to null or empty array to clear.
      responses:
        '200':
          description: Keywords updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  keywords:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid request - invalid type or validation error
        '401':
          description: Not authenticated
        '403':
          description: Requires ADMIN role
        '404':
          description: Content item not found

  # ============================================================================
  # EXCLUSIONS API
  # ============================================================================

  /admin/exclusions:
    get:
      summary: List workspace exclusions
      description: |
        List all exclusions across channels and playlists with cursor-based pagination.
        Supports filtering by parent type, exclude type, and search term.
      operationId: listExclusions
      tags: [Exclusions]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor from previous response
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum results per page (default 50, max 200)
        - name: parentType
          in: query
          schema:
            type: string
            enum: [CHANNEL, PLAYLIST]
          description: Filter by parent type
        - name: excludeType
          in: query
          schema:
            type: string
            enum: [VIDEO, PLAYLIST]
          description: Filter by excluded content type
        - name: search
          in: query
          schema:
            type: string
          description: Search term for filtering
      responses:
        '200':
          description: Paginated list of exclusions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusionPage'
        '400':
          description: Invalid cursor (non-numeric or negative value)
        '401':
          description: Not authenticated
        '403':
          description: Requires ADMIN role
        '503':
          description: Service unavailable (timeout or database error)
    post:
      summary: Create an exclusion
      description: |
        Add a new exclusion to a channel or playlist.
        The exclusion will prevent the specified content from appearing when browsing the parent.
      operationId: createExclusion
      tags: [Exclusions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExclusionRequest'
      responses:
        '200':
          description: Exclusion already existed (idempotent no-op). No mutation occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceExclusion'
        '201':
          description: Exclusion created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceExclusion'
        '400':
          description: Invalid request (missing required fields or invalid parent/exclude type)
        '401':
          description: Not authenticated
        '403':
          description: Requires ADMIN role

  /admin/exclusions/{id}:
    delete:
      summary: Remove an exclusion
      description: |
        Delete an exclusion by its composite ID.
        ID format: "parentType:parentId:storageType:excludeId" (single colon delimiter).
        The excluded content will again be visible when browsing the parent.
      operationId: removeExclusion
      tags: [Exclusions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Composite exclusion ID (e.g., "CHANNEL:abc123:VIDEO:xyz789")
      responses:
        '204':
          description: Exclusion removed successfully
        '400':
          description: Invalid ID format
        '401':
          description: Not authenticated
        '403':
          description: Requires ADMIN role
        '404':
          description: Parent not found

# ==============================================================================
# COMPONENT SCHEMAS
# ==============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication JWT token

  schemas:
    ContentReport:
      type: object
      properties:
        id:
          type: string
        targetType:
          type: string
          enum: [VIDEO, PLAYLIST, CHANNEL]
        targetId:
          type: string
        reasons:
          type: array
          items:
            type: string
            enum: [MUSIC, NUDITY, BAD_LANGUAGE, FLIRTING, ROMANCE, AWRAH, SHIRK, BIDAH, VIOLENCE, MISINFORMATION, OTHER]
        otherDescription:
          type: string
          nullable: true
        deviceId:
          type: string
        status:
          type: string
          enum: [PENDING, RESOLVED, REJECTED]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolutionNote:
          type: string
          nullable: true

    HomeCategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        localizedNames:
          type: object
          additionalProperties:
            type: string
          nullable: true
        displayOrder:
          type: integer
          nullable: true
        icon:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentItemDto'
        totalContentCount:
          type: integer

    CategorySortDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
          nullable: true
        localizedNames:
          type: object
          additionalProperties:
            type: string
          nullable: true
        displayOrder:
          type: integer
          nullable: true
        contentCount:
          type: integer
        parentCategoryId:
          type: string
          nullable: true
          description: Parent category ID (null for top-level categories)

    ContentSortDto:
      type: object
      properties:
        contentId:
          type: string
        contentType:
          type: string
          enum: [channel, playlist, video]
        title:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        position:
          type: integer
        youtubeId:
          type: string

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true
        parentCategoryId:
          type: string
          nullable: true
          description: Parent category ID (null for top-level categories)
        topLevel:
          type: boolean
          default: false
          description: True if this is a root category (no parent)
        hasSubcategories:
          type: boolean
          default: false
        icon:
          type: string
          nullable: true
          description: Emoji or icon identifier
        displayOrder:
          type: integer
          nullable: true
          description: Sort order within parent category. Null until explicitly set.
        localizedNames:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Localized category names (en, ar, nl)
          example:
            en: Islamic Knowledge
            ar: المعرفة الإسلامية
            nl: Islamitische Kennis
        createdBy:
          type: string
          nullable: true
          description: UID of user who created this category
        updatedBy:
          type: string
          nullable: true
          description: UID of user who last updated this category
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    CategoryDto:
      type: object
      description: Simplified category DTO for public API (read-only, excludes admin metadata)
      required: [id, name, slug]
      properties:
        id:
          type: string
          description: Firestore document ID
        name:
          type: string
          description: Category display name
        slug:
          type: string
          description: URL-friendly identifier (auto-generated from name if not provided)
        parentId:
          type: string
          nullable: true
          description: Parent category ID (null for top-level categories)

    Channel:
      type: object
      required: [id, youtubeId, name]
      properties:
        id:
          type: string
        youtubeId:
          type: string
          description: YouTube channel ID
        name:
          type: string
          description: Channel name/title
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        subscribers:
          type: integer
          format: int64
          nullable: true
          description: Subscriber count
        videoCount:
          type: integer
          nullable: true
          description: Number of videos in this channel
        categoryIds:
          type: array
          items:
            type: string
          description: List of category IDs this channel belongs to
        keywords:
          type: array
          items:
            type: string
          nullable: true
          description: Search keywords/tags for this channel. Auto-populated from YouTube tags during import if not provided.
        status:
          type: string
          enum: [APPROVED, PENDING, REJECTED]
          default: PENDING
          description: Approval status of the channel
        excludedItems:
          $ref: '#/components/schemas/ExcludedItems'
          nullable: true
          description: Items to exclude from this channel
        submittedBy:
          type: string
          nullable: true
          description: UID of user who submitted this channel
        approvedBy:
          type: string
          nullable: true
          description: UID of user who approved this channel
        approvalMetadata:
          $ref: '#/components/schemas/ApprovalMetadata'
          nullable: true
          description: Detailed approval/rejection metadata
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        displayOrder:
          type: integer
          nullable: true
          description: Integer sort order. Lower values appear first. Null until explicitly set.

    Playlist:
      type: object
      required: [id, youtubeId, title]
      properties:
        id:
          type: string
        youtubeId:
          type: string
          description: YouTube playlist ID
        title:
          type: string
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        itemCount:
          type: integer
          nullable: true
          description: Number of videos in this playlist
        categoryIds:
          type: array
          items:
            type: string
          description: List of category IDs this playlist belongs to
        keywords:
          type: array
          items:
            type: string
          nullable: true
          description: Search keywords/tags for this playlist.
        channelId:
          type: string
          nullable: true
          description: ID of the channel that owns this playlist
        status:
          type: string
          enum: [APPROVED, PENDING, REJECTED]
          default: PENDING
          description: Approval status of the playlist
        excludedVideoIds:
          type: array
          items:
            type: string
          nullable: true
          description: YouTube video IDs to exclude from this playlist
        submittedBy:
          type: string
          nullable: true
          description: UID of user who submitted this playlist
        approvedBy:
          type: string
          nullable: true
          description: UID of user who approved this playlist
        approvalMetadata:
          $ref: '#/components/schemas/ApprovalMetadata'
          nullable: true
          description: Detailed approval/rejection metadata
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        displayOrder:
          type: integer
          nullable: true
          description: Integer sort order. Lower values appear first. Null until explicitly set.

    Video:
      type: object
      required: [id, youtubeId, title]
      properties:
        id:
          type: string
        youtubeId:
          type: string
          description: YouTube video ID
        title:
          type: string
        description:
          type: string
          nullable: true
        thumbnailUrl:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          description: Video duration in seconds
        uploadedAt:
          type: string
          format: date-time
          nullable: true
          description: When the video was uploaded to YouTube
        viewCount:
          type: integer
          format: int64
          nullable: true
        channelId:
          type: string
          nullable: true
          description: YouTube channel ID that owns this video
        channelTitle:
          type: string
          nullable: true
          description: Channel name (cached from YouTube)
        categoryIds:
          type: array
          items:
            type: string
